  fonte: "credo | celson | fibery | whatsapp"
padrao: sequencial
entrada:
  - "Evidência mínima (valor + motivo + data)"
  - "Comprovativo quando existir (factura, extracto, screenshot transfer)"
saida:
  - "Entidade Ellocene/Financeiro criada ou actualizada"
  - "Comprovativo no Drive (se aplicável)"
  - "Estado Confirmado ou Pendente com dono"
criterio_feito:
  - "Existe entidade no Fibery com Valor + Tipo + Data + Responsável + Referência"
