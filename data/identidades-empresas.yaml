## Regras de Execução

1. **Fonte Única:** Nenhuma cor deve ser inventada num template. Toda a variável CSS deve vir de `data/design-systems/{empresa}/`.
2. **Fallback Seguro:** Se a empresa não tiver tokens definidos, o motor assume a identidade da Holding.
3. **Auditoria Obrigatória:** Antes de qualquer PDF ir para o cliente, `tools/audit-tokens.sh` deve passar com `exit 0`.
4. **Cliente = PDF:** Qualquer documento entregue externamente a clientes é estritamente em PDF (via WeasyPrint).
