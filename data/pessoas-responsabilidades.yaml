# Base de Conhecimento de Pessoas — holding Ellocene

> **Que é:** fonte única de verdade sobre **quem faz o quê na holding e nas filhas** — papéis, responsabilidades, autoridade e decisão. Todo agente MUST consultá-la antes de atribuir qualquer `Responsável` a Task, Document, Project ou Meeting.
> **Regra AI-native (C6):** um agente não atribui uma tarefa a uma pessoa sem confirmar nesta base que o domínio da tarefa é dessa pessoa. Sem correspondência → escalar ao @guardiao para decisão do Credo.
> **Origem:** elicitação directa do Credo em 2026-09-11 (~04:20 WAT) · **Mantenedor:** @governanca · mudanças de papel só com verificação do Credo.

