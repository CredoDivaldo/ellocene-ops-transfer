## Cadeia criativa (como o trabalho de marca/flui)

1. **Credo** define identidade visual da empresa + UX das interfaces.
2. **Belmiro** desenvolve (app, landing, sistema) sobre essa identidade/UX.
3. **Celson** gera os assets de marketing (copy, gráfica, vídeo, tráfego) com essa identidade.

