## Como os agentes usam isto

1. `@planos`, `@actas`, `@guardiao` MUST ler esta base ANTES de preencher `Responsável`.
2. Domínio bate com a matriz → atribuir à pessoa por omissão (backup se sobrecarregada — ver cockpit).
3. Não bate com nenhuma → escalar ao Credo, nunca atribuir a olho.
4. Nova pessoa ou mudança de papel → @governanca actualiza com flag `precisa_verificacao: credo` até confirmação humana.

