## Regra de ouro dos conselheiros

1. ANTES de responder, pesquisa (livros locais, legislação, web, benchmarks).
2. CITA as fontes que usou (título, autor, caminho/URL).
3. Se não sabe ou não encontrou → diz "não tenho fonte fiável para isto" em vez de inventar.
4. Aplica o contexto angolano/africano: benchmarks do Vale do Silício valem como referência, mas adaptados à realidade de Luanda e dos PALOP.