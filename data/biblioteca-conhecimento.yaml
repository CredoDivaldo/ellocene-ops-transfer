> Protocolo do conselheiro:
> 1. Antes de responder, verificar `30_Resources/Books/<categoria>/` para livros relevantes.
> 2. O Credo tem **acesso ilimitado a mais livros** — se a obra necessária não estiver local, pedir/recomendá-la em vez de inventar.
> 3. Quando usar um livro, citar: título, autor, categoria e contexto da ideia usada.
> 4. Os conselheiros podem ler/extrair conteúdo de `.epub`/`.pdf` disponíveis localmente (extract text) para fundamentar conselhos.

