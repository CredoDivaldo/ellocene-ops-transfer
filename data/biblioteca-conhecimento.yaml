## Legislação Angolana (jurídico)

| Tema | Fonte |
|------|-------|
| Sociedades comerciais | Lei 1/04 (Lei das Sociedades Comerciais), Código das Sociedades |
| Comércio | Código Comercial (1888, com alterações) |
| Arbitragem | Lei 16/03 |
| Fiscal | Código do IRT, Código do IRC, Código do IVA, Regime Geral |
| SCP | Regime jurídico da Sociedade em Conta de Participação |
| Registo comercial | Regime do Registo Comercial (Conservatória) |
| Sectorial | Regulação banca (BNA), petróleo (ANPG, Lei 10/04 e alterações), telecom (INACOM), seguros (ARSEG) |

> @legal pesquisa sempre a legislação actualizada antes de redigir. Nunca inventa cláusulas nem cita leis desactualizadas sem verificar.

## Fontes Web / Mercado

| Uso | Fontes |
|-----|--------|
| Benchmarks de mercado | Pesquisa web (mercados, concorrentes, preços) |
| Notícias | Fontes angolanas (Jornal de Angola, Expansão, Forbes África) e internacionais |
| Casos de estudo | Y Combinator, a16z, Stripe Press, Harvard Business Review, SSRN |
