name: ellocene-ops
version: 1.0.0
description: 'Cérebro operacional e de conselho da holding Ellocene. Dua camadas: (1) Agentes operacionais (governança, actas,
  planos, registo, portfólio, KPIs, relatórios, docs, legal) que automatizam processos ponta-a-ponta sobre as bases Ellocene/*
  do Fibery; (2) Conselho de Administração (CEO, CFO, CTO, CMO, CHRO, CRO) com personalidade de C-level Silicon Valley/YC,
  que pesquisa conhecimento dinamicamente em fontes credíveis (livros, legislação, mercados) para dar conselho de leverage
  e apoiar decisões. Tudo ligado por fluxos cross-agents com handoffs e gates humanos.'
author: CredoDivaldo
license: MIT
